name: PS5-vakt
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency: vakt
jobs:
  sjekk:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 vakt.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PRO_MAKSPRIS: "8500"
